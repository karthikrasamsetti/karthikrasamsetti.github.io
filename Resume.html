              </div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
                {s.items.map((it, j) => (
                  <span key={j} style={{ fontFamily: fontBody, fontSize: 9, background: "#f2f2f3", padding: "2px 6px", borderRadius: 2 }}>{it}</span>
                ))}
              </div>
            </div>
          ))}
        </div>
      </section>

      {/* EXPERIENCE */}
      <section style={{ marginBottom: gap }}>
        <SectionTitle num="03" label="EXPERIENCE" />
        {R.experience.map((job, i) => (
          <div key={i} style={{ marginBottom: i === R.experience.length - 1 ? 0 : 16 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 4 }}>
              <div>
                <span style={{ fontFamily: fontDisplay, fontSize: 13, fontWeight: 700 }}>{job.company}</span>
                <span style={{ color: accent, margin: "0 7px" }}>/</span>
                <span style={{ fontSize: 11.5, color: "#222" }}>{job.role}</span>
              </div>
              <div style={{ fontFamily: fontBody, fontSize: 9, color: "#777", fontVariantNumeric: "tabular-nums" }}>{job.period}</div>
            </div>
            <div style={{ marginBottom: 7 }}><Tag text={job.domain.toLowerCase()} color="#888" /></div>
            <ul style={{ margin: 0, paddingLeft: 0, listStyle: "none" }}>
              {job.bullets.map((b, j) => (
                <li key={j} style={{ display: "grid", gridTemplateColumns: showMetrics ? "1fr 100px" : "1fr", gap: 10, padding: "2.5px 0", fontSize: 10.5, lineHeight: 1.55, alignItems: "baseline" }}>
                  <span style={{ display: "flex", gap: 9 }}>
                    <span style={{ color: accent, fontFamily: fontBody, flexShrink: 0 }}>›</span>
                    <span>{b.text}</span>
                  </span>
                  {showMetrics && <span style={{ textAlign: "right" }}><Tag text={b.metric} /></span>}
                </li>
              ))}
            </ul>
          </div>
        ))}
      </section>

      {/* AI */}
      {showAI && (
        <section style={{ marginBottom: gap }}>
          <SectionTitle num="04" label="AI_QE" />
          <ul style={{ margin: 0, paddingLeft: 0, listStyle: "none" }}>
            {R.ai.map((a, i) => (
              <li key={i} style={{ display: "flex", gap: 9, padding: "2.5px 0", fontSize: 10.5 }}>
                <span style={{ color: accent, fontFamily: fontBody, flexShrink: 0 }}>›</span>
                <span>{a}</span>
              </li>
            ))}
          </ul>
        </section>
      )}

      {/* WINS + EDU */}
      <section style={{ display: "grid", gridTemplateColumns: "1.2fr 1fr", gap: 32 }}>
        <div>
          <SectionTitle num={showAI ? "05" : "04"} label="WINS" />
          <ul style={{ margin: 0, paddingLeft: 0, listStyle: "none" }}>
            {R.achievements.map((a, i) => (
              <li key={i} style={{ display: "flex", gap: 9, padding: "2.5px 0", fontSize: 10.5 }}>
                <span style={{ color: accent, fontFamily: fontBody, flexShrink: 0 }}>✓</span>
                <span>{a}</span>
              </li>
            ))}
          </ul>
        </div>
        <div>
          <SectionTitle num={showAI ? "06" : "05"} label="EDU" />
          <div style={{ fontFamily: fontDisplay, fontSize: 11.5, fontWeight: 700, marginBottom: 2 }}>{R.education.school}</div>
          <div style={{ fontFamily: fontBody, fontSize: 9, color: "#777", marginBottom: 6 }}>{R.education.location}</div>
          <div style={{ fontSize: 10.5, marginBottom: 2 }}>{R.education.degree}</div>
          <div style={{ fontFamily: fontBody, fontSize: 9, color: "#777", fontVariantNumeric: "tabular-nums", marginTop: 2 }}>{R.education.period} · {R.education.grade}</div>
          <div style={{ fontSize: 9.5, color: "#888", marginTop: 4 }}>{R.education.extras}</div>
        </div>
      </section>
    </div>
  );
}

/* ─────────────────────────────────────────────────────────
   ARTBOARD WRAPPER  (canvas view, zoom-scaled)
   ───────────────────────────────────────────────────────── */
const PAGE_W = 794;
const PAGE_H = 1123;

function Artboard({ variant, label, tweaks, zoom, focused, onFocus }) {
  const w = PAGE_W * zoom;
  const h = PAGE_H * zoom;

  const Comp = variant === "editorial" ? ResumeEditorial : variant === "tech" ? ResumeTech : ResumeModern;

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 10 }}>
      <span style={{ fontSize: 10, fontWeight: 500, letterSpacing: "0.1em", textTransform: "uppercase", color: "#6b6760" }}>{label}</span>
      <div
        onClick={onFocus}
        style={{
          width: w,
          height: h,
          position: "relative",
          background: "#fff",
          boxShadow: focused ? "0 0 0 2px #fff, 0 0 0 4px #5a7ff0, 0 8px 40px rgba(0,0,0,0.5)" : "0 4px 24px rgba(0,0,0,0.4)",
          cursor: "pointer",
          borderRadius: 2,
          overflow: "hidden",
          transition: "box-shadow 0.15s ease",
          flexShrink: 0,
        }}
        title={"Click to focus " + label}
      >
        <div style={{ transform: "scale(" + zoom + ")", transformOrigin: "top left", width: PAGE_W, height: PAGE_H, pointerEvents: "none" }}>
          <Comp tweaks={tweaks} />
        </div>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────────────────
   TWEAKS PANEL
   ───────────────────────────────────────────────────────── */
function TweaksPanel({ tweaks, setTweak, onClose }) {
  const s = {
    panel: {
      position: "fixed",
      right: 16,
      bottom: 16,
      width: 240,
      background: "#1c1a17",
      border: "1px solid #2e2c28",
      borderRadius: 8,
      boxShadow: "0 8px 32px rgba(0,0,0,0.6)",
      fontFamily: "'Inter', system-ui, sans-serif",
      fontSize: 11,
      color: "#c8c4bc",
      zIndex: 100,
      overflow: "hidden",
    },
    header: {
      display: "flex", alignItems: "center", justifyContent: "space-between",
      padding: "10px 14px",
      borderBottom: "1px solid #2e2c28",
      fontSize: 11, fontWeight: 600, letterSpacing: "0.08em", textTransform: "uppercase",
      color: "#e8e4db",
    },
    section: { padding: "10px 14px", borderBottom: "1px solid #1e1c19" },
    label: { display: "block", fontSize: 10, color: "#8a8680", fontWeight: 500, marginBottom: 6, letterSpacing: "0.05em", textTransform: "uppercase" },
    row: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 },
  };

  const Radio = ({ label, optKey, options }) => (
    <div style={s.row}>
      <span style={{ color: "#a8a49c", fontSize: 10.5 }}>{label}</span>
      <div style={{ display: "flex", gap: 4 }}>
        {options.map(o => (
          <button
            key={o.value}
            onClick={() => setTweak(optKey, o.value)}
            style={{
              padding: "2px 8px", fontSize: 9.5, borderRadius: 3, border: "none", cursor: "pointer",
              background: tweaks[optKey] === o.value ? "#5a7ff0" : "#2a2824",
              color: tweaks[optKey] === o.value ? "#fff" : "#a8a49c",
              fontFamily: "'Inter', system-ui, sans-serif",
            }}
          >{o.label}</button>
        ))}
      </div>
    </div>
  );

  const Toggle = ({ label, optKey }) => (
    <div style={s.row}>
      <span style={{ color: "#a8a49c", fontSize: 10.5 }}>{label}</span>
      <div
        onClick={() => setTweak(optKey, !tweaks[optKey])}
        style={{
          width: 32, height: 18, borderRadius: 9, background: tweaks[optKey] ? "#16A34A" : "#2a2824",
          position: "relative", cursor: "pointer", transition: "background 0.2s",
        }}
      >
        <div style={{
          width: 14, height: 14, borderRadius: "50%", background: "#fff",
          position: "absolute", top: 2,
          left: tweaks[optKey] ? 16 : 2,
          transition: "left 0.2s",
        }} />
      </div>
    </div>
  );

  const ColorRow = ({ label, optKey }) => (
    <div style={s.row}>
      <span style={{ color: "#a8a49c", fontSize: 10.5 }}>{label}</span>
      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
        <span style={{ fontFamily: "monospace", fontSize: 10, color: "#6b6760" }}>{tweaks[optKey]}</span>
        <input type="color" value={tweaks[optKey]} onChange={e => setTweak(optKey, e.target.value)}
          style={{ width: 24, height: 20, border: "none", padding: 0, background: "none", cursor: "pointer", borderRadius: 3 }} />
      </div>
    </div>
  );

  return (
    <div style={s.panel} className="no-print">
      <div style={s.header}>
        <span>Tweaks</span>
        <button onClick={onClose} style={{ background: "none", border: "none", color: "#6b6760", cursor: "pointer", fontSize: 16, lineHeight: 1, padding: 0 }}>×</button>
      </div>
      <div style={s.section}>
        <span style={s.label}>Layout</span>
        <Radio label="Density" optKey="density" options={[{ value: "comfortable", label: "Normal" }, { value: "compact", label: "Compact" }]} />
        <div style={s.row}>
          <span style={{ color: "#a8a49c", fontSize: 10.5 }}>Font pairing</span>
          <select value={tweaks.fontPair} onChange={e => setTweak("fontPair", e.target.value)}
            style={{ background: "#2a2824", border: "none", color: "#c8c4bc", fontSize: 10, borderRadius: 3, padding: "2px 6px", cursor: "pointer", fontFamily: "'Inter', system-ui, sans-serif" }}>
            <option value="default">Per-variant</option>
            <option value="inter">Inter (all)</option>
            <option value="serif">Serif (all)</option>
            <option value="mono">Mono (all)</option>
            <option value="mixed">Serif + sans</option>
          </select>
        </div>
      </div>
      <div style={s.section}>
        <span style={s.label}>Accent Colors</span>
        <ColorRow label="Modern (A)" optKey="accentModern" />
        <ColorRow label="Editorial (B)" optKey="accentEditorial" />
        <ColorRow label="Tech (C)" optKey="accentTech" />
      </div>
      <div style={{ padding: "10px 14px" }}>
        <span style={s.label}>Sections</span>
        <Toggle label="Show AI section" optKey="showAI" />
        <Toggle label="Show metrics" optKey="showMetrics" />
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────────────────
   FOCUSED PRINT VIEW  (full A4, no chrome)
   ───────────────────────────────────────────────────────── */
function FocusedView({ variant, tweaks, onBack }) {
  const Comp = variant === "editorial" ? ResumeEditorial : variant === "tech" ? ResumeTech : ResumeModern;
  const accentKey = variant === "editorial" ? "accentEditorial" : variant === "tech" ? "accentTech" : "accentModern";
  const fp = FONT_PAIRS[tweaks.fontPair] || FONT_PAIRS.default;
  const t = { ...tweaks, accent: tweaks[accentKey], fontBody: fp.body, fontDisplay: fp.display };

  const label = variant === "editorial" ? "B · Editorial Classic" : variant === "tech" ? "C · Tech / Engineering" : "A · Modern Minimal";

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", background: "#0f0e0c" }}>
      {/* Focused toolbar */}
      <div className="no-print" style={{
        height: 44, display: "flex", alignItems: "center", gap: 12,
        padding: "0 20px", background: "#161412", borderBottom: "1px solid #2a2724",
        flexShrink: 0,
      }}>
        <button onClick={onBack} style={{
          background: "#2a2724", border: "none", color: "#c8c4bc", fontSize: 11,
          padding: "4px 12px", borderRadius: 4, cursor: "pointer", display: "flex", alignItems: "center", gap: 6,
          fontFamily: "'Inter', system-ui, sans-serif",
        }}>
          ← All variants
        </button>
        <span style={{ fontSize: 11, color: "#6b6760" }}>{label}</span>
        <div style={{ flex: 1 }} />
        <button onClick={() => window.print()} style={{
          background: "#5a7ff0", border: "none", color: "#fff", fontSize: 11,
          padding: "4px 14px", borderRadius: 4, cursor: "pointer",
          fontFamily: "'Inter', system-ui, sans-serif", fontWeight: 500,
        }}>
          Print / Save PDF
        </button>
      </div>

      {/* Scrollable preview */}
      <div className="no-print" style={{ flex: 1, overflow: "auto", display: "flex", justifyContent: "center", alignItems: "flex-start", padding: "32px 24px", background: "#0f0e0c" }}>
        <div style={{ width: PAGE_W, background: "#fff", boxShadow: "0 4px 32px rgba(0,0,0,0.5)", borderRadius: 2 }}>
          <Comp tweaks={t} />
        </div>
      </div>

      {/* Print-only output (replaces everything on Ctrl+P) */}
      <div className="print-page" style={{ width: PAGE_W, minHeight: PAGE_H, background: "#fff" }}>
        <Comp tweaks={t} />
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────────────────
   FONT PAIRS
   ───────────────────────────────────────────────────────── */
const FONT_PAIRS = {
  default: { body: null, display: null },
  inter:   { body: "'Inter', system-ui, sans-serif",           display: "'Inter', system-ui, sans-serif" },
  serif:   { body: "'Source Serif 4', Georgia, serif",         display: "'Source Serif 4', Georgia, serif" },
  mono:    { body: "'JetBrains Mono', ui-monospace, monospace", display: "'JetBrains Mono', ui-monospace, monospace" },
  mixed:   { body: "'Inter', system-ui, sans-serif",           display: "'Source Serif 4', Georgia, serif" },
};

/* ─────────────────────────────────────────────────────────
   APP
   ───────────────────────────────────────────────────────── */
function App() {
  const [tweaks, setTweaks] = useState({
    accentModern:    "#0A6CFF",
    accentEditorial: "#7A1F1F",
    accentTech:      "#16A34A",
    fontPair:  "default",
    density:   "comfortable",
    showAI:    true,
    showMetrics: true,
  });
  const [zoom, setZoom]         = useState(0.58);
  const [focused, setFocused]   = useState(null);
  const [showTweaks, setShowTweaks] = useState(false);

  const setTweak = (key, val) => setTweaks(t => ({ ...t, [key]: val }));

  const fp = FONT_PAIRS[tweaks.fontPair] || FONT_PAIRS.default;

  const variants = [
    { id: "modern",    label: "A · Modern Minimal",    accentKey: "accentModern" },
    { id: "editorial", label: "B · Editorial Classic",  accentKey: "accentEditorial" },
    { id: "tech",      label: "C · Tech / Engineering", accentKey: "accentTech" },
  ];

  if (focused) {
    return (
      <FocusedView
        variant={focused}
        tweaks={tweaks}
        onBack={() => setFocused(null)}
      />
    );
  }

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column" }}>

      {/* ── TOOLBAR ── */}
      <div className="no-print" style={{
        height: 48, display: "flex", alignItems: "center", gap: 16,
        padding: "0 20px", background: "#161412", borderBottom: "1px solid #242220",
        flexShrink: 0,
      }}>
        <div style={{ fontSize: 12, fontWeight: 600, color: "#e8e4db", letterSpacing: "-0.01em" }}>
          Karthik Rasamsetti
          <span style={{ fontSize: 10, fontWeight: 400, color: "#6b6760", marginLeft: 8 }}>Resume</span>
        </div>

        <div style={{ flex: 1 }} />

        {/* Zoom */}
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <button onClick={() => setZoom(z => Math.max(0.3, z - 0.05))} style={btnStyle}>−</button>
          <span style={{ fontSize: 10, color: "#6b6760", width: 34, textAlign: "center", fontFamily: "monospace" }}>
            {Math.round(zoom * 100)}%
          </span>
          <button onClick={() => setZoom(z => Math.min(1.0, z + 0.05))} style={btnStyle}>+</button>
        </div>

        <div style={{ width: 1, height: 20, background: "#2a2724" }} />

        {/* Tweaks toggle */}
        <button onClick={() => setShowTweaks(v => !v)} style={{
          ...btnStyle,
          background: showTweaks ? "#5a7ff020" : "transparent",
          color: showTweaks ? "#5a7ff0" : "#8a8680",
          padding: "4px 10px", gap: 5,
          border: showTweaks ? "1px solid #5a7ff040" : "1px solid transparent",
        }}>
          ⚙ Tweaks
        </button>

        <div style={{ width: 1, height: 20, background: "#2a2724" }} />

        <span style={{ fontSize: 10, color: "#6b6760" }}>Click an artboard to focus + print</span>
      </div>

      {/* ── CANVAS ── */}
      <div style={{
        flex: 1, overflow: "auto", background: "#0f0e0c",
        padding: "48px 48px 80px",
        display: "flex", alignItems: "flex-start", justifyContent: "center",
      }}>
        <div style={{ display: "flex", gap: Math.max(24, 40 * zoom), alignItems: "flex-start" }}>
          {variants.map(v => {
            const t = {
              ...tweaks,
              accent: tweaks[v.accentKey],
              fontBody: fp.body,
              fontDisplay: fp.display,
            };
            return (
              <Artboard
                key={v.id}
                variant={v.id}
                label={v.label}
                tweaks={t}
                zoom={zoom}
                focused={focused === v.id}
                onFocus={() => setFocused(v.id)}
              />
            );
          })}
        </div>
      </div>

      {/* ── TWEAKS PANEL ── */}
      {showTweaks && (
        <TweaksPanel tweaks={tweaks} setTweak={setTweak} onClose={() => setShowTweaks(false)} />
      )}
    </div>
  );
}

const btnStyle = {
  background: "#2a2724",
  border: "1px solid #3a3834",
  color: "#c8c4bc",
  fontSize: 11,
  padding: "3px 9px",
  borderRadius: 4,
  cursor: "pointer",
  fontFamily: "'Inter', system-ui, sans-serif",
  display: "flex",
  alignItems: "center",
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
